<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro profundo (combinando con el modo oscuro de Ergasterion) -->
    <linearGradient id="bgErgasterion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E" />
      <stop offset="100%" stop-color="#11121A" />
    </linearGradient>

    <!-- Degradado principal: Índigo -> Magenta -> Cian -->
    <linearGradient id="ergGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Degradado claro para el asa y el broche -->
    <linearGradient id="lightMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Contenedor principal redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bgErgasterion)" />

  <!-- Sombra base inferior -->
  <ellipse cx="256" cy="436" rx="145" ry="12" fill="#000000" opacity="0.4" />

  <!-- Destello minimalista (referencia a la insignia de proyectos) -->
  <path d="M402 82 L408 100 L426 106 L408 112 L402 130 L396 112 L378 106 L396 100 Z" fill="#2DD4BF" />

  <!-- ASA DEL MALETÍN -->
  <path d="M196 164 V130 C196 114, 208 102, 224 102 H288 C304 102, 316 114, 316 130 V164" fill="none" stroke="url(#lightMetal)" stroke-width="24" stroke-linecap="round" />

  <!-- CUERPO PRINCIPAL DEL MALETÍN -->
  <rect x="96" y="160" width="320" height="236" rx="36" fill="url(#ergGrad)" />

  <!-- Solapa superior (capa translúcida para dar volumen) -->
  <path d="M96 196 C96 176, 112 160, 132 160 H380 C400 160, 416 176, 416 196 V244 C416 264, 400 280, 380 280 H132 C112 280, 96 264, 96 244 Z" fill="#FFFFFF" opacity="0.16" />

  <!-- Luz volumétrica en la mitad derecha (mismo estilo que Ágora y Kapileio) -->
  <path d="M256 160 H380 C400 160, 416 176, 416 196 V360 C416 380, 400 396, 380 396 H256 Z" fill="#FFFFFF" opacity="0.10" />

  <!-- BROCHE CENTRAL -->
  <rect x="224" y="252" width="64" height="48" rx="14" fill="url(#lightMetal)" />
  <rect x="242" y="268" width="28" height="16" rx="5" fill="#1E1B2E" opacity="0.85" />
</svg>